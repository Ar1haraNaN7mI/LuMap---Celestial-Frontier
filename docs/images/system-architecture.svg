<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc">
<title id="title">Lumap: native clients and shared learning architecture</title>
<desc id="desc">Native macOS and iPhone or iPad clients use a shared Swift domain. LumapStore controls the session and progression. LearningAgentService plans, generates, evaluates and adapts through validated contracts and LumapAIClient provider adapters. Public-topic research and selected private material excerpts follow separate input routes; document contents do not become public search queries. Configured model providers receive the chosen learning context. SwiftData, Keychain, validated caches, Kokoro narration and media export run on-device. Current personalization uses model decisions with local constraints; trained RL and camera-based AR are not deployed in this architecture.</desc>
