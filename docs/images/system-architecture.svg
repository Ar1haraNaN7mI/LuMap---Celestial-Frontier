<text x="64" y="121" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="40" font-weight="650" fill="#20243B" text-anchor="start">Native experience. Shared learning intelligence.</text>
<text x="64" y="163" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#596078" text-anchor="start">Implemented MVP · model-driven adaptation with local progression constraints</text>
