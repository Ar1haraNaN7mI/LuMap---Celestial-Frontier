<text x="893" y="860" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#167B70" text-anchor="middle">Evidence shapes the next section</text>
<rect x="64" y="902" width="1288" height="66" rx="16" fill="#FFFFFF" stroke="#C9CDD9" stroke-width="1.5"/>
<text x="91" y="944" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#5753C7" text-anchor="start">FOCUS BY DESIGN</text>
<text x="304" y="944" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#596078" text-anchor="start">Current section visible · completed history available · future content hidden</text>
</svg>
